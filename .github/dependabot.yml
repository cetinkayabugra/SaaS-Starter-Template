version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Minor and patch bumps are grouped into one PR — a template with this many
    # dependencies would otherwise produce a steady drip of noise. Majors stay
    # separate so breaking changes get reviewed on their own.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Next.js majors land alongside React majors and need a coordinated
      # upgrade, not an automated PR.
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
