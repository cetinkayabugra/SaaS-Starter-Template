name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # The build imports lib/env.ts, which fails fast when a required variable
      # is missing. These are throwaway values that only need to be non-empty —
      # no network calls are made at build time, so nothing here has to be real.
      DATABASE_URL: postgresql://user:password@localhost:5432/db
      NEXTAUTH_SECRET: ci-placeholder-secret
      NEXTAUTH_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      STRIPE_PRICE_ID_PRO: price_placeholder_pro
      STRIPE_PRICE_ID_TEAM: price_placeholder_team
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      # Must come before setup-node: `cache: pnpm` resolves the store path by
      # running pnpm, which has to exist by then. Version comes from the
      # packageManager field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm 11 requires Node >=22.13; an older Node fails when setup-node
          # invokes pnpm to resolve the cache path.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # lib/generated/ is gitignored, so the Prisma client has to be built
      # before anything typechecks. Needs no database connection.
      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
